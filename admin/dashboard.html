<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f4f6f9; }
    .sidebar { width:220px; background:#343a40; color:#fff; min-height:100vh; position:fixed; }
    .sidebar h4 { text-align:center; padding:20px; border-bottom:1px solid #495057; }
    .sidebar a { color:#fff; display:block; padding:12px; text-decoration:none; }
    .sidebar a:hover { background:#495057; }
    .content { margin-left:220px; padding:20px; }
    .circle-card {
      width:260px; height:190px; border-radius:60%;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      color:#fff; font-weight:bold; margin:20px auto;
      box-shadow:0 4px 10px rgba(0,0,0,0.2); transition:transform 0.2s;
    }
    .circle-card:hover { transform:scale(1.05); }
    .circle-card h5 { margin:0; font-size:18px; }
    .circle-card h3 { margin:5px 0 0; font-size:28px; }
    .quick-actions button { margin-right:10px; }
    .progress { height:20px; border-radius:10px; }
    .loading { color:#aaa; font-style:italic; }
  </style>
</head>
<body>
<div class="d-flex">

  <!-- Sidebar -->
  <div class="sidebar">
    <h4>UrbanAura Fashion</h4>
    <a href="users.php">👥 Users</a>
    <a href="categories.php">🗂️ Categories</a>
    <a href="Adminproducts.html">👗 Products</a>
    <a href="adminorders.php">📦 Orders</a>
    <hr>
    <a href="#" onclick="logout()">🚪 Logout</a>
  </div>

  <!-- Content -->
  <div class="content">
    <h2 class="mb-4">Welcome, Admin 👋</h2>

    <!-- Circle Stat Cards -->
    <div class="row text-center">
      <div class="col-md-3"><div class="circle-card bg-primary"><h5>Total Products</h5><h3 id="statProducts">...</h3></div></div>
      <div class="col-md-3"><div class="circle-card bg-success"><h5>Orders</h5><h3 id="statOrders">...</h3></div></div>
      <div class="col-md-3"><div class="circle-card bg-warning text-dark"><h5>Users</h5><h3 id="statUsers">...</h3></div></div>
      <div class="col-md-3"><div class="circle-card bg-danger"><h5>Revenue</h5><h3 id="statRevenue">...</h3></div></div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions mb-4">
      <button class="btn btn-primary" onclick="window.location.href='Adminproducts.html'">+ View Product</button>
      <button class="btn btn-success" onclick="window.location.href='adminorders.php'">📦 View Orders</button>
      <button class="btn btn-warning" onclick="window.location.href='users.php'">👥 Manage Users</button>
      <button class="btn btn-secondary" onclick="window.location.href='categories.php'">🗂️ Categories</button>
    </div>

    <!-- Recent Orders -->
    <div class="card mb-4 p-3">
      <h4>Recent Orders</h4>
      <table class="table table-sm" id="recentOrdersTable">
        <thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="recentOrdersBody">
          <tr><td colspan="5" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Stock Levels -->
    <div class="card mb-4 p-3">
      <h4>Low Stock Products</h4>
      <div id="stockBars"><p class="loading">Loading...</p></div>
    </div>

    <!-- Sales Chart -->
    <div class="card mb-4 p-3">
      <h4>Sales Overview</h4>
      <canvas id="salesChart"></canvas>
    </div>

  </div>
</div>

<script>
if (localStorage.getItem("isAdmin") !== "true") {
  window.location.href = "../login.html";
}
function logout() {
  localStorage.removeItem("isAdmin");
  window.location.href = "../login.html";
}

async function loadDashboard() {
  try {
    const res  = await fetch('http://localhost/clothes(website)/api/dashboard-stats.php', { credentials: 'include' });
    const data = await res.json();

    document.getElementById('statProducts').innerText = data.total_products ?? '0';
    document.getElementById('statOrders').innerText   = data.total_orders   ?? '0';
    document.getElementById('statUsers').innerText    = data.total_users    ?? '0';
    document.getElementById('statRevenue').innerText  = '₹' + (data.revenue ?? '0');

    const tbody = document.getElementById('recentOrdersBody');
    if (data.recent_orders && data.recent_orders.length > 0) {
      tbody.innerHTML = data.recent_orders.map(o => `
        <tr>
          <td>#UA${String(o.order_id).padStart(6,'0')}</td>
          <td>${o.customer_name}</td>
          <td>₹${parseFloat(o.total_amount).toLocaleString('en-IN')}</td>
          <td><span class="badge bg-${o.order_status==='pending'?'warning text-dark':o.order_status==='delivered'?'success':'secondary'}">${o.order_status}</span></td>
          <td>${o.order_date.slice(0,10)}</td>
        </tr>`).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="5" style="color:#aaa;text-align:center;">No orders yet</td></tr>';
    }

    const stockDiv = document.getElementById('stockBars');
    if (data.low_stock && data.low_stock.length > 0) {
      stockDiv.innerHTML = data.low_stock.map(s => {
        const pct   = Math.min(100, Math.round((s.stock / 50) * 100));
        const color = pct <= 20 ? 'bg-danger' : pct <= 50 ? 'bg-warning' : 'bg-success';
        return `<p>${s.product_name} <small style="color:#aaa;">(${s.stock} left)</small></p>
                <div class="progress mb-3"><div class="progress-bar ${color}" style="width:${pct}%">${pct}%</div></div>`;
      }).join('');
    } else {
      stockDiv.innerHTML = '<p style="color:#aaa;">All products well stocked ✅</p>';
    }

    const labels  = data.monthly_sales ? data.monthly_sales.map(m => m.month) : [];
    const amounts = data.monthly_sales ? data.monthly_sales.map(m => m.total) : [];
    const ctx = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Sales (₹)',
          data: amounts,
          borderColor: 'rgba(75,192,192,1)',
          fill: true,
          backgroundColor: 'rgba(75,192,192,0.2)',
          tension: 0.4
        }]
      },
      options: { responsive: true, plugins: { legend: { display: true } } }
    });

  } catch(e) {
    console.error('Dashboard load error:', e);
    ['statProducts','statOrders','statUsers','statRevenue'].forEach(id => {
      document.getElementById(id).innerText = '—';
    });
  }
}

loadDashboard();
</script>
</body>
</html>
