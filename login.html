<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UrbanAura - Login & Register</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#fbc2eb);background-size:400% 400%;animation:gradientMove 12s ease infinite;overflow-x:hidden;padding-bottom:40px;}
@keyframes gradientMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.nav__container{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 40px;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);position:fixed;top:0;left:0;z-index:100;}
.nav__logo{font-weight:700;color:#fff;text-decoration:none;font-size:20px;}
.nav__links{list-style:none;display:flex;gap:20px;}
.nav__links a{text-decoration:none;font-weight:600;color:#fff;}
.nav__links a:hover{text-decoration:underline;}
.auth-card{max-width:460px;width:95%;border-radius:25px;backdrop-filter:blur(25px);background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.3);box-shadow:0 25px 60px rgba(0,0,0,0.15);overflow:hidden;margin-top:90px;}
.form-container{display:flex;width:200%;transition:0.5s ease-in-out;}
.form-box{width:50%;padding:35px 40px;}
h3{font-weight:700;color:#fff;margin-bottom:20px;text-align:center;}
.form-control{border-radius:12px;padding:11px 15px;border:none;background:rgba(255,255,255,0.85);font-size:13px;margin-bottom:12px;width:100%;}
.form-control:focus{box-shadow:0 0 12px rgba(255,255,255,0.6);outline:none;background:#fff;}
.form-control::placeholder{color:#aaa;}
.password-wrapper{position:relative;margin-bottom:12px;}
.password-wrapper .form-control{padding-right:42px;margin-bottom:0;}
.password-wrapper i{position:absolute;top:50%;right:14px;transform:translateY(-50%);cursor:pointer;color:#777;font-size:15px;}
.btn-user-login{width:100%;border-radius:30px;font-weight:700;font-size:13px;background:linear-gradient(45deg,#4e73df,#224abe);border:none;color:#fff;padding:12px;margin-top:10px;display:block;cursor:pointer;transition:0.2s;}
.btn-user-login:hover{opacity:0.88;transform:translateY(-1px);}
.btn-admin-login{width:100%;border-radius:30px;font-weight:700;font-size:13px;background:linear-gradient(45deg,#1cc88a,#13855c);border:none;color:#fff;padding:12px;margin-top:10px;display:block;cursor:pointer;transition:0.2s;}
.btn-admin-login:hover{opacity:0.88;transform:translateY(-1px);}
.btn-register{width:100%;border-radius:30px;font-weight:700;font-size:13px;background:linear-gradient(45deg,#4e73df,#224abe);border:none;color:#fff;padding:12px;margin-top:10px;cursor:pointer;transition:0.2s;}
.btn-register:hover{opacity:0.88;transform:translateY(-1px);}
.toggle-link{cursor:pointer;font-weight:700;color:#fff;text-decoration:underline;}
.msg{text-align:center;font-size:12px;font-weight:600;margin-top:8px;min-height:18px;}
.msg.error{color:#ff3b3b;}.msg.success{color:#00ff88;}
.sub-text{text-align:center;color:rgba(255,255,255,0.9);font-size:12px;margin-top:14px;}
</style>
</head>
<body>
<nav class="nav__container">
  <a href="index.html" class="nav__logo">URBAN AURA FASHION</a>
  <ul class="nav__links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="feedback.html">Feedback</a></li>
  </ul>
</nav>

<div class="auth-card">
  <div id="formContainer" class="form-container">

    <!-- PANEL 1: REGISTER -->
    <div class="form-box">
      <h3>Create Account</h3>
      <form onsubmit="registerUser(event)" autocomplete="off">
        <input type="text"  id="regName"     class="form-control" placeholder="Full Name" required autocomplete="off">
        <input type="email" id="regEmail"    class="form-control" placeholder="Email Address" required autocomplete="off">
        <input type="tel"   id="regPhone"    class="form-control" placeholder="Mobile Number" autocomplete="off">
        <div class="password-wrapper">
          <input type="password" id="regPassword" class="form-control password-field" placeholder="Password" required autocomplete="new-password">
          <i class="bi bi-eye-slash toggle-password"></i>
        </div>
        <div class="password-wrapper">
          <input type="password" id="regConfirm" class="form-control password-field" placeholder="Confirm Password" required autocomplete="new-password">
          <i class="bi bi-eye-slash toggle-password"></i>
        </div>
        <button type="submit" class="btn-register">Register</button>
      </form>
      <div id="registerMsg" class="msg"></div>
      <p class="sub-text">Already have an account? <span class="toggle-link" onclick="showLogin()">Login here</span></p>
    </div>

    <!-- PANEL 2: LOGIN -->
    <div class="form-box">
      <h3>Welcome Back</h3>
      <input type="email" id="loginEmail" class="form-control" placeholder="Username or Email" autocomplete="off">
      <div class="password-wrapper">
        <input type="password" id="loginPassword" class="form-control password-field" placeholder="Password" autocomplete="new-password">
        <i class="bi bi-eye-slash toggle-password"></i>
      </div>
      <button class="btn-user-login" onclick="doLogin('customer')">
        <i class="bi bi-person-fill"></i> User Login
      </button>
      <button class="btn-admin-login" onclick="doLogin('admin')">
        <i class="bi bi-shield-lock-fill"></i> Admin Login
      </button>
      <div id="loginMsg" class="msg"></div>
      <p class="sub-text">Don't have an account? <span class="toggle-link" onclick="showRegister()">Register</span></p>
    </div>

  </div>
</div>

<script>
function showLogin()    { document.getElementById('formContainer').style.transform='translateX(-50%)'; }
function showRegister() { document.getElementById('formContainer').style.transform='translateX(0%)'; }
document.querySelectorAll('.toggle-password').forEach(function(icon){
  icon.addEventListener('click',function(){
    var inp=this.previousElementSibling;
    if(inp.type==='password'){inp.type='text';this.classList.replace('bi-eye-slash','bi-eye');}
    else{inp.type='password';this.classList.replace('bi-eye','bi-eye-slash');}
  });
});
async function registerUser(e){
  e.preventDefault();
  var name=document.getElementById('regName').value.trim();
  var email=document.getElementById('regEmail').value.trim();
  var phone=document.getElementById('regPhone').value.trim();
  var pass=document.getElementById('regPassword').value;
  var conf=document.getElementById('regConfirm').value;
  var msg=document.getElementById('registerMsg');
  if(pass!==conf){msg.className='msg error';msg.textContent='Passwords do not match!';return;}
  if(pass.length<6){msg.className='msg error';msg.textContent='Password must be at least 6 characters!';return;}
  var fd=new FormData();
  fd.append('name',name);fd.append('email',email);fd.append('password',pass);fd.append('phone',phone);
  try{
    var res=await fetch('http://localhost/clothes(website)/api/register.php',{method:'POST',credentials:'include',body:fd});
    var data=await res.json();
    if(data.success){
      msg.className='msg success';msg.textContent='Registered! Redirecting...';
      localStorage.setItem('loggedInUser',JSON.stringify({name:data.name,email:email}));
      setTimeout(function(){window.location.href='index.html';},1500);
    }else{msg.className='msg error';msg.textContent=data.message;}
  }catch(e){msg.className='msg error';msg.textContent='Server error. Is XAMPP running?';}
}
async function doLogin(role){
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPassword').value;
  var msg=document.getElementById('loginMsg');
  if(!email||!pass){msg.className='msg error';msg.textContent='Please enter email and password!';return;}
  var fd=new FormData();
  fd.append('email',email);fd.append('password',pass);fd.append('role',role);
  try{
    var res=await fetch('http://localhost/clothes(website)/api/login.php',{method:'POST',credentials:'include',body:fd});
    var data=await res.json();
    if(data.success){
      msg.className='msg success';msg.textContent='Welcome, '+data.name+'!';
      localStorage.setItem('loggedInUser',JSON.stringify({name:data.name,email:email,role:data.role}));
      if(data.role==='admin'){
        localStorage.setItem('isAdmin','true');
        setTimeout(function(){window.location.href='admin/dashboard.html';},1500);
      }else{
        setTimeout(function(){window.location.href='index.html';},1500);
      }
    }else{msg.className='msg error';msg.textContent=data.message;}
  }catch(e){msg.className='msg error';msg.textContent='Server error. Is XAMPP running?';}
}
</script>
</body>
</html>
